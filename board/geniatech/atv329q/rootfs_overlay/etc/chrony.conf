# chrony config for the atv329q.
#
# This box has NO battery-backed RTC: every boot starts at 1970-01-01, so the
# initial offset is ~56 years. Hence "makestep 1.0 -1": always step (never slew)
# when the offset is above 1 s, at any point in time -- a slew would take
# centuries and TLS (docker pull, https) stays broken until the clock is right.
pool pool.ntp.org iburst

makestep 1.0 -1

driftfile /var/lib/chrony/drift

# Keep a bit of state across reboots so the first sync converges faster.
dumpdir /var/lib/chrony

# The kernel RTC (pm8916) has no battery, but syncing it is harmless and lets
# hwclock read something sane while the box stays powered.
rtcsync

# Local-only command socket (chronyc on the box); no NTP service to the LAN.
cmdport 323
